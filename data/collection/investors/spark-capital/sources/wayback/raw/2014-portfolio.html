<script>
if(platform=='ajax'){

    // I hate to add these states but it makes it much easier to track where the nav is going and where it's coming from:
    var pageToPage;
    var toHome;
    var stayOnHome;
    var awayFromHome;
    var smartAjaxRunning = false;

    SmartAjax_load('http://www.sparkcapital.com/wordpress/wp-content/themes/sparkcapital/js/smartajax/',function(){
        SmartAjax.isDebug=false;
        SmartAjax.setOptions({
            cache:false,
            reload:true,
            containers:[
              // Name of the content div is chnaged before new content arrives so that we can fade back and forth, but here's the destination:
              {selector: '#main-container',showIfFound:false},

              // commented because it doesn't work anyway when we try to use this to highlight the correct menu item.
              // there's some js in 'hardcodeTheStupidMenuItem' to work around this with js logic.
              //{selector: '#main-nav'},

              // An empty div that receives the new bkg image. Transition is then called to move this into the main background div:
              {selector: '#bkg-loader'},

              // Ditto for the captions -- although I don't think this is used anymore since captions are attached to the backgrounds
              // with a data attribute instead and transitioned to explicitly. SmartAjax isn't great with nice transitions.
              {selector: '#bkg-caption-loader'}

            ],
            before: function(url){

                // Bail out if previous transition isn't complete:
                if( smartAjaxRunning ) {
                    //console.log('url=',url,' but already ajaxing');
                    return;
                } else {
                    //console.log('url=',url);
                }

                // Disable nav until the previous one is finished:
                smartAjaxRunning = true;

                // Figure out what type of transition this is since we don't always want to replace the content of the main div, specifically
                // when you navigate to the main page and there's no new content to insert.
                pageToPage = (url!=docroot && home==0);
                toHome = (url==docroot && home==0);
                stayOnHome = (url==docroot && home==1);
                awayFromHome = (url!=docroot && home==1);

                // From one inner page to another.
                if( pageToPage ) {

                    // This section makes room for new content. It:
                    //   1. Fixes the size of the #main-container div
                    //   2. Changes the id of the #main-container to #main-container-orig
                    //   3. Inserts a new #main-container with the same dimensions as the original
                    // 
                    // After this, SmartAjax takes over
                    //   4. SmartAjax inserts the new content into #main-container
                    //   5. SmartAjax executes the 'done' callback
                    //
                    // The done callback:
                    //   6. Figures out the dimensions of the new content
                    //   7. Fades out the original to reveal the new content
                    //   8. Simultaneously animates to the new height
                    //   10. Removes the original content
                    //   11. Changes the id of the new content to #main-container, now replacing the original
                    //   12. Changes height of #main-container to 'auto' so that we don't have to resize it manually.


                    // Change the id of the current main-container and add a new main-container
                    // that will hold the new content. Then fade out the container with the changed
                    // id to expose the new content.
                    var orig_main = $('#main-container');
                    var cur_width = orig_main.width();
                    var cur_height = orig_main.height();

                    // Fix the height and position of the current content
                    orig_main.css({
                        width: cur_width,
                        height: cur_height,
                        position: 'absolute'
                    });

                    // Change the id of the current content
                    orig_main.attr('id','main-container-orig')

                    var new_main = $('<div id="main-container"></div>');

                    new_main.css({
                        width: cur_width,
                        height: cur_height,
                    });

                    orig_main.after(new_main);

                    SmartAjax.proceed();

                } else if( stayOnHome ) {
                  // open/close the main nav and do nothing else:
                  clickedOnSparkLogo();

                  smartAjaxRunning = false;

                } else if( awayFromHome ) {
                  SmartAjax.proceed();

                } else if( toHome ) {
                  clickedOnSparkLogo();

                  setTimeout(function() {
                      SmartAjax.proceed();
                  },speed);
                }

            },
            success:function(url){
                smartAjaxRunning = false;
                SmartAjax.proceed();
            },
            error:function(url){
                smartAjaxRunning = false;
                top.location=url;
                window.location.reload();
            },
            done:function(url){
                //smartAjaxRunning = false;

                hardcodeTheStupidMenuItem();
                pushOntoBgImageQueue();
                resizeBg();

                $('html, body').animate({scrollTop:0},speed,easing);

                // This part is explained above
                if( pageToPage ) {

                  $('#main-container').animate({
                      height: $('#main-container #sub-nav').height() +
                              $('#main-container #content').height()
                  }, speed, easing, function() {
                    $('#main-container').css({
                      height: 'auto',
                      width: 'auto'
                    });
                  });

                  $('#main-container-orig').fadeOut( 200, function() {
                      $(this).remove();
                      smartAjaxRunning = false;
                      pageSpecificCallbacks();
                  });
                } else {
                    pageSpecificCallbacks();
                }

                setTimeout(function() {
                  smartAjaxRunning = false;
                },speed);

                resizeTeamPage();



                resizeLogo();

                // This code was here before I started working on it. It's not clear to me which classes body would
                // have anyway. I see some when pages are loaded, but they all get removed here and none are re-added,
                // so I don't really see the point. Going to comment and wait to see if something breaks:
                //$('body').removeClass();


                // Do some positioning of the nav (when main div opens/closes):
                if( !toHome ) {
                    doTransition();
                }

                // Activate JS placeholders again: (why not jQuery.on ?)
                setPlaceholders();
            }
        });    
        SmartAjax.bind('.smaj');
        SmartAjax.bind('.ajax a');
        SmartAjax.bindForms('#top-search-form');
        SmartAjax.bindForms('#contact-form');
    }, true);
}
</script>
